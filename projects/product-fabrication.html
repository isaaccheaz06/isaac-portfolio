          INTRO
              Objects that start as drawings and end as things you can hold. This work
              moves between parametric modelling, digital fabrication and hands-on
              assembly, testing form in paper and cardboard before committing it to
              wood, ceramic or filament.

          TOOLS
              Rhino · Grasshopper · CNC · 3D Printing

          FEATURED PROJECTS (all three are linked from the home page)
              Digital Kintsugi            digital-kintsugi.html
                  A digitally fabricated reinterpretation of Japanese kintsugi
                  combining ceramic 3D printing, intentional fracture, 3D scanning,
                  Rhino reconstruction, and a custom PLA repair component.
                  Rhino · 3D Scanning · Ceramic 3D Printing · FDM 3D Printing

              Suzume-Inspired CNC Stool   suzume-cnc-stool.html
                  A small three-legged wooden stool inspired by the chair character
                  from Suzume, developed through cardboard prototyping, CAD, CNC
                  fabrication, and physical assembly.
                  Rhino · Carbide Create · CNC Machining

              Parametric Butterfly Pavilion   butterfly-pavilion.html
                  A butterfly-inspired pavilion developed through physical paper
                  form-finding and parametric surface design, then laser-cut and
                  assembled as a large-scale paper model.
                  Rhino · Grasshopper · Laser Cutting
